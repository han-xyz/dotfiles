# 6 band sink equalizer
#
# Copy this file into a conf.d/ directory such as
# ~/.config/pipewire/filter-chain.conf.d/
#
context.modules = [
    { name = libpipewire-module-filter-chain
        args = {
            node.description = "Equalizer Sink (JBL Quantum 350 TEST)"
            media.name       = "Equalizer Sink (JBL Quantum 350 TEST)"
            filter.graph = {
                nodes = [
                    {
                        type  = builtin
                        name  = eq_band_preamp
                        label = bq_highshelf
                        control = { "Freq" = 0.0 "Q" = 1.0 "Gain" = 11.0 }

                    }
                    {
                        type  = builtin
                        name  = eq_band_1
                        label = bq_lowshelf
                        # label = bq_highpass
                        # control = { "Freq" = 105.0 "Q" = 0.7 "Gain" = 6.2 }
                        # control = { "Freq" = 105.0 "Q" = 0.7 "Gain" = 8.2 }
                        control = { "Freq" = 105.0 "Q" = 0.7 "Gain" = 8.6 }
                    }
                    {
                        type  = builtin
                        name  = eq_band_2
                        label = bq_peaking
                        # label = bq_bandpass
                        # control = { "Freq" = 102.0 "Q" = 2.64 "Gain" = 1.8 }
                        # control = { "Freq" = 102.0 "Q" = 2.64 "Gain" = 3.8 }
                        # control = { "Freq" = 1400.0 "Q" = 2.64 "Gain" = 3.8 }
                        control = { "Freq" = 102.0 "Q" = 2.64 "Gain" = 3.4 }
                    }
                    {
                        type  = builtin
                        name  = eq_band_3
                        label = bq_peaking
                        # label = bq_lowpass
                        # control = { "Freq" = 1956.0 "Q" = 0.83 "Gain" = -7.9 }
                        # control = { "Freq" = 1956.0 "Q" = 0.83 "Gain" = -5.9 }
                        # control = { "Freq" = 165.0 "Q" = 0.83 "Gain" = -5.9 }
                        control = { "Freq" = 1956.0 "Q" = 0.83 "Gain" = -5.7 }
                    }
                    {
                        type  = builtin
                        name  = eq_band_4
                        label = bq_peaking
                        # label = bq_allpass
                        # control = { "Freq" = 4428.0 "Q" = 1.84 "Gain" = -4.6 }
                        # control = { "Freq" = 5000.0 "Q" = 1.84 "Gain" = -4.6 }
                        control = { "Freq" = 4428.0 "Q" = 1.84 "Gain" = -2.0 }
                    }
                    {
                        type  = builtin
                        name  = eq_band_5
                        label = bq_peaking
                        # control = { "Freq" = 6902.0 "Q" = 0.68 "Gain" = 8.2 }
                        control = { "Freq" = 6902.0 "Q" = 0.68 "Gain" = 7.9 }
                    }
                    {
                        type  = builtin
                        name  = eq_band_6
                        label = bq_peaking
                        # control = { "Freq" = 229.0 "Q" = 2.82 "Gain" = -0.8 }
                         control = { "Freq" = 229.0 "Q" = 2.82 "Gain" = -0.6 }
                    }
                    {
                        type  = builtin
                        name  = eq_band_7
                        label = bq_peaking
                        # control = { "Freq" = 426.0 "Q" = 3.59 "Gain" = 1.2 }
                        control = { "Freq" = 426.0 "Q" = 3.59 "Gain" = 1.8 }
                    }
                    {
                        type  = builtin
                        name  = eq_band_8
                        label = bq_peaking
                        # control = { "Freq" = 5171.0 "Q" = 6.0 "Gain" = -1.5 }
                        control = { "Freq" = 5171.0 "Q" = 6.0 "Gain" = -1.6 }
                    }
                    {
                        type  = builtin
                        name  = eq_band_9
                        label = bq_peaking
                        # control = { "Freq" = 5811.0 "Q" = 6.0 "Gain" = 1.9 }
                        control = { "Freq" = 5811.0 "Q" = 6.0 "Gain" = 2.5 }
                    }
                    {
                        type  = builtin
                        name  = eq_band_10
                        label = bq_highshelf
                        # control = { "Freq" = 10000.0 "Q" = 0.7 "Gain" = -1.1 }
                        control = { "Freq" = 10000.0 "Q" = 0.7 "Gain" = -1.6 }
                    }
                    
                ]
                links = [
                    { output = "eq_band_preamp:Out" input = "eq_band_1:In" }
                    { output = "eq_band_1:Out" input = "eq_band_2:In" }
                    { output = "eq_band_2:Out" input = "eq_band_3:In" }
                    { output = "eq_band_3:Out" input = "eq_band_4:In" }
                    { output = "eq_band_4:Out" input = "eq_band_5:In" }
                    { output = "eq_band_5:Out" input = "eq_band_6:In" }
                    { output = "eq_band_6:Out" input = "eq_band_7:In" }
                    { output = "eq_band_7:Out" input = "eq_band_8:In" }
                    { output = "eq_band_8:Out" input = "eq_band_9:In" }
                    { output = "eq_band_9:Out" input = "eq_band_10:In" }
                ]
            }
	    audio.channels = 2
	    audio.position = [ FL FR ]
            capture.props = {
                node.name   = "effect_input2.eq11"
                media.class = Audio/Sink
            }
            playback.props = {
                node.name   = "effect_output2.eq11"
                node.passive = true
            }
        }
    }
]
